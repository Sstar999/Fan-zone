<style>
/* Layout: HUD on top, scrolling screen in the middle, 5-tab bar at the bottom. The match is a side-on court with a timing meter underneath. Dark arena look by design, matching the league's night-game feel. */
:root{--ink:#0a0f1e;--panel:#121a31;--panel2:#1b2646;--line:#2b3963;--chalk:#f3efe6;--mute:#9aa6c8;--ball:#ff7a2f;--blue:#4f8cff;--good:#3ddc97;--warn:#ffc857;--bad:#ff5d6c;--fd:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--fb:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
:root[lang="ar"]{--fd:"Cairo",system-ui,sans-serif;--fb:"Cairo",system-ui,sans-serif}
:root[lang="ar"] *{letter-spacing:0!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);background-image:radial-gradient(800px 420px at 85% -8%,#1d2c5c 0,transparent 65%);color:var(--chalk);font:500 15px/1.45 var(--fb);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input{font:inherit}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.app{height:100%;max-width:1000px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.hud{display:flex;align-items:center;gap:8px;padding-block:10px;flex-wrap:wrap}
.logo{font:900 26px/1 var(--fd);letter-spacing:.05em;margin-inline-end:auto;display:flex;align-items:center;gap:8px}
.logo i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a57,#ff7a2f 55%,#c9490d);display:block}
.logo span{color:var(--ball)}
.chip{font:800 17px/1 var(--fd);letter-spacing:.03em;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;color:var(--chalk)}
.chip small{font:600 11px var(--fb);color:var(--mute);letter-spacing:.04em}
button.chip{cursor:pointer}
.screen{overflow-y:auto;padding-block:6px 22px;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-block:8px 6px;border-top:1px solid var(--line)}
.app.inmatch .tabs{display:none}
.tab{background:none;border:0;color:var(--mute);font:700 11.5px var(--fb);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;cursor:pointer;position:relative;min-width:0}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ball);background:var(--panel)}
.tab.play .ic{background:var(--ball);color:var(--ink);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;margin-top:-16px;border:3px solid var(--ink)}
.tab.play[aria-current="page"]{background:none}
.tab .dot{position:absolute;top:4px;inset-inline-end:24%;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.eyebrow{font:800 12px var(--fd);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.big{font:900 clamp(32px,8vw,56px)/.98 var(--fd);text-transform:uppercase;text-wrap:balance;margin:6px 0 10px}
.big.sm{font-size:clamp(28px,6.5vw,40px)}
:root[lang="ar"] .big{line-height:1.3;text-transform:none}
.sub{color:var(--mute);max-width:58ch;margin:0 0 14px}
.mut{color:var(--mute);font-size:13px}
.btn{font:700 16px var(--fb);background:var(--ball);color:#0a0f1e;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.blue{background:var(--blue)}
.btn.ghost{background:transparent;color:var(--chalk);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.lg{padding:15px 26px;font-size:19px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.col{display:grid;gap:14px;min-width:0}
@media(max-width:780px){.grid2{grid-template-columns:1fr}}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#18244d,#121a31 62%)}
.hero::after{content:"";position:absolute;inset-inline-end:-70px;bottom:-90px;width:270px;height:270px;border-radius:50%;border:3px solid rgba(255,122,47,.35);box-shadow:0 0 0 24px rgba(255,122,47,.08);pointer-events:none}
.hero>*{position:relative;z-index:1}
.journey{display:grid;gap:10px;margin-top:12px}
.jr{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.jr .n{font:900 22px/1 var(--fd);color:var(--ball);min-width:20px;text-align:center}
.jr b{font:800 18px/1.1 var(--fd);text-transform:uppercase;display:block}
:root[lang="ar"] .jr b{text-transform:none}
.jr span.d{color:var(--mute);font-size:13px}
.jr.hot{background:var(--ball);border-color:var(--ball);color:var(--ink)}
.jr.hot .n{color:var(--ink)}.jr.hot span.d{color:#3b1d0b}
.bar{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tbtn{--c:var(--line);text-align:start;border:2px solid var(--c);background:var(--panel2);border-radius:14px;padding:12px;cursor:pointer;display:grid;gap:3px;min-width:0}
.tbtn b{font:900 22px/1 var(--fd);text-transform:uppercase}
:root[lang="ar"] .tbtn b{text-transform:none}
.tbtn span{font-size:12px;color:var(--mute)}
.tbtn .badge{color:var(--ink);font-size:11px}
.hero .big{font-size:clamp(30px,5.2vw,46px)}
.tbtn[aria-pressed="true"]{background:var(--panel);box-shadow:0 0 0 2px var(--c)}
.tbtn.off{border-style:dashed;border-color:var(--line);cursor:default;opacity:.6}
.badge{font:800 11px var(--fb);padding:2px 8px;border-radius:99px;background:var(--good);color:var(--ink);display:inline-block}
.badge.warn{background:var(--warn)}
.fx{display:flex;align-items:center;justify-content:space-between;gap:10px;direction:ltr;margin:6px 0}
.fx b{font:900 clamp(24px,6vw,34px)/1 var(--fd);text-transform:uppercase}
.fx i{font-style:normal;color:var(--mute);font:800 14px var(--fd)}
.srow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:10px}
.mini{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.gl{width:34px;height:34px;display:grid;place-items:center;margin-inline:auto;color:var(--ball)}
.gl svg{width:30px;height:30px;fill:currentColor;font-family:var(--fd)}
.ct{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:14px;padding:14px;display:grid;gap:6px;align-content:start;text-align:start}
.ct .top{display:flex;gap:10px;align-items:center}
.ct .gl{width:46px;height:46px;border-radius:12px;background:var(--ink);border:1px solid var(--ball);margin:0;flex:none}
.ct b{font:800 20px/1.1 var(--fd);text-transform:uppercase}
:root[lang="ar"] .ct b{text-transform:none}
.meter{position:relative;height:34px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;direction:ltr;margin-block:12px}
.meter .zy{position:absolute;top:0;bottom:0;background:rgba(255,200,87,.35)}
.meter .zg{position:absolute;top:0;bottom:0;background:rgba(61,220,151,.6)}
.meter .dot{position:absolute;top:5px;left:0;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--ball);border:2px solid var(--chalk)}
.rev{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
@media(max-width:520px){.rev{grid-template-columns:1fr}}
.fc{perspective:900px;cursor:pointer;height:150px;border:0;background:none;padding:0;display:block;width:100%}
.fc .in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.fc.f .in{transform:rotateY(180deg)}
.fc .fa,.fc .fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px}
.fc .fa{background:repeating-linear-gradient(135deg,#17224a 0 12px,#1b2a5c 12px 24px);border:2px solid var(--line);display:grid;place-items:center;font:900 22px var(--fd);color:var(--ball);text-align:center;padding:8px}
.fc .fb{transform:rotateY(180deg)}
.fc .fb .ct{height:100%}
.court{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0b1230}
.court canvas{display:block;width:100%;height:auto;aspect-ratio:960/504}
.sbd{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;direction:ltr;gap:8px}
.tm{background:rgba(10,15,30,.84);border-left:5px solid var(--c);padding:6px 12px;border-radius:10px;min-width:0}
.tm.r{border-left:0;border-right:5px solid var(--c);text-align:right}
.tm b{font:900 38px/1 var(--fd);display:block}
.tm small{font-size:12px;color:var(--mute);display:block}
.rd{background:rgba(10,15,30,.84);border-radius:10px;padding:6px 12px;text-align:center;font:800 14px var(--fd);letter-spacing:.06em;display:grid;gap:2px}
.rd em{font-style:normal;color:var(--ball);letter-spacing:.2em}
.com{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(10,15,30,.84);border-radius:10px;padding:8px 12px;font-size:14px;min-height:36px}
@media(max-width:520px){.tm b{font-size:28px}.tm{padding:4px 8px}.com{font-size:12px;padding:5px 9px;min-height:0}}
.ctl{margin-top:12px}
.kbd{font:700 12px var(--fb);color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.cardbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.cardbar .st{font-size:13px;color:var(--mute);min-width:0}
.res .score{font:900 72px/1 var(--fd);display:flex;gap:16px;align-items:center;direction:ltr;margin:6px 0 10px}
.res .score i{color:var(--mute);font-style:normal}
.note{background:var(--panel2);border-radius:12px;padding:12px;margin-top:10px}
.note p{margin:4px 0 0;color:var(--mute)}
.opt{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:start;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;width:100%}
.opt:hover{border-color:var(--ball)}
.opt b{font:800 17px var(--fd);text-transform:uppercase}
:root[lang="ar"] .opt b{text-transform:none}
.opt span{color:var(--mute);font-size:13px;grid-column:1}
.opt .pc{grid-column:2;grid-row:1/3;font:900 22px var(--fd);align-self:center}
.opt .bar{grid-column:1/-1;margin-top:4px}
.opt.win{border-color:var(--good)}
.opt.sel{border-color:var(--blue)}
.ovc{display:grid;gap:14px;max-width:520px;width:100%}
.ov{position:fixed;inset:0;background:rgba(5,8,18,.9);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.seal{border:3px dashed var(--ball);border-radius:16px;padding:26px;text-align:center;background:var(--panel)}
.seal b{font:900 30px var(--fd);text-transform:uppercase;display:block}
:root[lang="ar"] .seal b{text-transform:none}
.ch{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.ch:last-child{border-bottom:0}
.ch .bar{margin-top:6px;width:100%}
.tk{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;border:2px dashed var(--ball);border-radius:14px;padding:12px;background:var(--panel)}
.code{font:700 15px ui-monospace,Menlo,Consolas,monospace;background:var(--ink);border-radius:6px;padding:3px 8px;display:inline-block;direction:ltr}
.qr{width:84px;height:84px;background:var(--chalk);color:var(--ink);padding:6px;border-radius:8px}
.qr svg{width:100%;height:100%;display:block;fill:currentColor}
.rwc{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.rwc:last-child{border-bottom:0}
.rwc b{font:800 18px/1.15 var(--fd);text-transform:uppercase;display:block}
:root[lang="ar"] .rwc b{text-transform:none}
.fi{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--chalk)}
.fld{display:grid;gap:4px;margin-top:10px}
.fld label{font-size:13px;color:var(--mute)}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:14px}
.chk input{width:20px;height:20px;margin:2px 0 0;flex:none}
.fun{display:grid;gap:8px;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px;align-items:center}
.fr .bar{grid-column:1/-1}
.fr b{font:900 20px var(--fd)}
.fr.real span{color:var(--ball);font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kpis div{background:var(--panel2);border-radius:10px;padding:10px;font-size:12px;color:var(--mute)}
.kpis b{display:block;font:900 24px/1.1 var(--fd);color:var(--chalk)}
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.cfg{grid-template-columns:1fr}}
.max{font:900 34px/1 var(--fd);color:var(--ball);margin-top:12px}
.safe{margin:0;padding:0;list-style:none;display:grid;gap:8px;margin-top:10px}
.safe li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px}
.safe li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);margin-top:7px}
.pill{font:700 12px var(--fb);color:var(--ink);background:var(--warn);border-radius:99px;padding:2px 10px;display:inline-block}
.foot{color:var(--mute);font-size:12px;margin-top:14px;max-width:84ch}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--chalk);color:var(--ink);font-weight:700;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function qr(code){
  let h=0;for(const ch of code)h=(Math.imul(h,31)+ch.charCodeAt(0))>>>0;
  let x=h||1;const r=()=>{x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;return x/4294967296};
  const n=17;let s='';
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    let fill;const fz=(i<7&&j<7)?[i,j]:(i<7&&j>9)?[i,j-10]:(i>9&&j<7)?[i-10,j]:null;
    if(fz){const [a,b]=fz;fill=a===0||a===6||b===0||b===6||(a>=2&&a<=4&&b>=2&&b<=4)}else fill=r()>.5;
    if(fill)s+=`<rect x="${j}" y="${i}" width="1" height="1"/>`;
  }
  return `<svg viewBox="0 0 17 17" shape-rendering="crispEdges" aria-hidden="true">${s}</svg>`;
}

function updateUI(){

function startRound(){
  M.shots=0;M.max=3+M.extra;M.extra=0;M.up=0;M.wide=false;M.busy=false;

}
function useCard(){

  M.used=true;const id=M.my;
  if(id==='double'){M.dbl=true;say(t('aDouble'))}

  if(id==='fast'){M.sc[0]+=6;pushFloat('+6','#3ddc97');say(t('aFast'))}
  if(id==='lock'){M.lock=true;say(t('aLock'))}

async function shoot(){
  if(!M||M.stage!=='play'||M.busy)return;
  const me=M;me.busy=true;meter.on=false;updateUI();
  const p0=hitPts(ZONE+(me.wide?8:0));
  let p=p0;
  if(p0===3&&me.hot){p+=2;me.hot=false}
  if(p0===3&&me.chal){p+=4;me.chal=false}
  if(p>0&&me.dbl){p*=2;me.dbl=false}
  const res=p0===3?'swish':p0===2?'rim':'miss';
  await animShot(res);if(M!==me)return;
  me.sc[0]+=p;me.up+=p;me.shots++;
  pushFloat(p?'+'+p:'MISS',p?'#3ddc97':'#ff5d6c');
  say(LINES[lang][res][rnd(2)]);updateUI();
  await sleep(450);if(M!==me)return;
  if(me.r===3&&me.shots===2&&!me.clutchDone&&me.shots<me.max){me.clutchDone=true;await clutchVote(me);if(M!==me)return}
  if(me.shots>=me.max)endRound();else{me.busy=false;meter.on=true;updateUI()}
}
function clutchVote(me){return new Promise(res=>{
  me.cres=res;
  const opts=[['cl1t','cl1d'],['cl2t','cl2d'],['cl3t','cl3d']];
  $('#ovh').innerHTML=`<div class="ov"><div class="ovc"><div><div class="eyebrow">${t('clT')} <span class="pill">${t('partnerSlot')}</span></div><p class="sub" style="margin:6px 0 0">${t('clSub')}</p></div>
  ${opts.map((o,i)=>`<button class="opt" data-a="cvote" data-v="${i}"><b>${t(o[0])}</b><span>${t(o[1])}</span></button>`).join('')}</div></div>`;
})}
function mysteryReveal(me){return new Promise(res=>{
  me.mres=res;
  $('#ovh').innerHTML=`<div class="ov"><div class="ovc"><div class="seal"><div class="eyebrow">${t('mysT')} <span class="pill">${t('partnerSlot')}</span></div><b>${t('mysT')}</b><p class="sub" style="margin:8px 0 0">${t('mysSub')}</p></div><button class="btn lg" data-a="mreveal">${t('mysBtn')}</button></div></div>`;
})}
async function endRound(){
  const me=M;me.busy=true;meter.on=false;say(t('rivalsBall'));updateUI();
  await sleep(800);if(M!==me)return;
  let bm=me.mb.reduce((a,r)=>a+botScore(r),0),bo=me.rb.reduce((a,r)=>a+botScore(r),0);
  if(me.lock){bo=Math.round(bo*.6);me.lock=false}
  if(me.lockQ4&&me.r===3)bo=Math.round(bo*.7);
  let note='';
  if(me.r===me.rq){
    const c=me.rc;
    if(c==='double')bo=Math.round(bo*1.5);if(c==='hot')bo+=4;if(c==='fast')bo+=5;if(c==='lock')bm=Math.round(bm*.6);if(c==='sixth')bo+=3;
    note=' '+t('rivalPlay',t('c_'+c),me.r+1);
  }
  me.sc[0]+=bm;me.sc[1]+=bo;
  say(t('recap',me.r+1,me.up,bm,bo)+note);updateUI();
  await sleep(1900);if(M!==me)return;
  if(me.r===1){await mysteryReveal(me);if(M!==me)return}
  me.r++;
  if(me.r>=4)finish();else startRound();
}
function finish(){
  while(M.sc[0]===M.sc[1]){M.sc[0]+=rnd(4);M.sc[1]+=rnd(4)}
  const w=M.sc[0]>M.sc[1];M.win=w;
  let counted=false,fp=0;
  if(G.playsToday<DAILY_PLAYS){counted=true;fp=10+(w?15:0);gain(fp);G.playsToday++;G.x.players=1}
  G.playsAll++;M.rw={fp,counted};M.stage='end';meter.on=false;draw();
}
